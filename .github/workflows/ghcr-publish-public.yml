name: Publish GHCR public
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: latest
permissions:
  packages: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (links package to this repo)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/causq-networks/praxis-node:${{ inputs.tag }}
            ghcr.io/causq-networks/praxis-node:latest
          labels: |
            org.opencontainers.image.source=https://github.com/CausQ-Networks/praxis-node
      - name: Set visibility public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/v.json -w "%{http_code}" -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/orgs/CausQ-Networks/packages/container/praxis-node/visibility" \
              -d '{"visibility":"public"}')
            echo "attempt $i HTTP $code"; cat /tmp/v.json; echo
            [ "$code" = "204" ] || [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "::warning::Visibility API still failing; connect repo in package settings and set Public manually."
