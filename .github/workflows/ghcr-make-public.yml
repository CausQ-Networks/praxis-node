name: Make this GHCR package public
on:
  workflow_dispatch:
permissions:
  packages: write
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - name: Set package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: praxis-node
          ORG: CausQ-Networks
        run: |
          set -euo pipefail
          echo "Trying org visibility API for $ORG/$PKG"
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/orgs/${ORG}/packages/container/${PKG}/visibility" \
            -d '{"visibility":"public"}')
          echo "HTTP $code"; cat /tmp/out.json; echo
          # Also try user endpoint in case package is user-owned
          code2=$(curl -sS -o /tmp/out2.json -w "%{http_code}" -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/container/${PKG}/visibility" \
            -d '{"visibility":"public"}')
          echo "user HTTP $code2"; cat /tmp/out2.json; echo
